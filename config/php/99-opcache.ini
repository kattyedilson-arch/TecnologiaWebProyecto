; Configuración explícita de OPcache para el contenedor web.
; Sin php.ini el oficial de PHP lo habilita por defecto; esta config
; lo hace determinista y tunable. No se aplica a CLI (enable_cli=0).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=1