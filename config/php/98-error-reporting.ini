; Configuración de reporte de errores para el contenedor web.
; Impide que los errores internos de PHP (rutas del proyecto, SQL, trazas)
; se muestren al usuario final: se registran en el log del contenedor
; (docker compose logs web) y la página sigue mostrando solo su HTML.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
error_reporting=E_ALL & ~E_DEPRECATED & ~E_NOTICE
