services:
  web:
    build: .
    container_name: gestion_web
    restart: always
    ports:
      - "8010:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=tutorias_db
      - DB_USER=tutorias_user
      - DB_PASS=${DB_PASS:-12345}
      - DB_PERSISTENT=1
      - DB_PING=1
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: gestion_db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
      MYSQL_DATABASE: tutorias_db
      MYSQL_USER: tutorias_user
      MYSQL_PASSWORD: "${DB_PASS:-12345}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gestion_phpmyadmin
    restart: always
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
    depends_on:
      - db

volumes:
  mysql_data: